name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      scaffolded: ${{ steps.check.outputs.scaffolded }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          if test -f Draigara.Forge.slnx || test -f Draigara.Forge.sln; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: detect
    if: needs.detect.outputs.scaffolded == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate public executable references
        shell: pwsh
        run: ./tools/validate-docs.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"

  specification-only:
    needs: detect
    if: needs.detect.outputs.scaffolded != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Source projects have not been scaffolded yet; documentation validation is handled separately."
