name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files
        shell: bash
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/architecture.md
          test -f docs/bridge-protocol.md
          test -d docs/adr
      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path PRODUCT-CONTEXT.md './**/*.md'
