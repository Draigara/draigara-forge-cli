name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate documentation and release configuration
        shell: pwsh
        run: ./tools/validate-docs.ps1
      - run: npm run check
      - name: Verify packed CLI
        shell: pwsh
        run: ./tools/smoke-test-package.ps1
